<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="resBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051419" />
      <stop offset="50%" stop-color="#082329" />
      <stop offset="100%" stop-color="#040c10" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="resGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#resBg)" />

  <!-- City map stylized abstract vectors -->
  <g stroke="rgba(20,184,166,0.14)" stroke-width="2" fill="none">
    <path d="M 0 140 Q 220 180, 400 120 T 800 200" />
    <path d="M 0 280 Q 260 220, 500 290 T 800 320" />
    <path d="M 180 0 L 220 450" />
    <path d="M 460 0 L 410 450" />
    <path d="M 680 0 L 710 450" />
  </g>

  <!-- Header -->
  <rect x="40" y="30" width="720" height="46" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="68" cy="53" r="5" fill="#ff5f56" />
  <circle cx="86" cy="53" r="5" fill="#ffbd2e" />
  <circle cx="104" cy="53" r="5" fill="#27c93f" />
  <text x="130" y="58" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">Resolyn AI // Intelligent Civic Incident Triaging &amp; Governance Map</text>
  <rect x="630" y="42" width="112" height="22" rx="11" fill="rgba(20,184,166,0.18)" stroke="#14b8a6" stroke-width="1" />
  <text x="686" y="57" text-anchor="middle" fill="#2dd4bf" font-family="Inter, sans-serif" font-size="11" font-weight="700">CITY LIVE</text>

  <!-- Left Map Panel -->
  <rect x="40" y="96" width="460" height="324" rx="16" fill="rgba(0,0,0,0.4)" stroke="rgba(20,184,166,0.25)" />
  
  <!-- Map Street Blocks -->
  <rect x="70" y="130" width="100" height="70" rx="8" fill="rgba(20,184,166,0.08)" stroke="rgba(20,184,166,0.15)" />
  <rect x="190" y="130" width="130" height="70" rx="8" fill="rgba(20,184,166,0.08)" stroke="rgba(20,184,166,0.15)" />
  <rect x="340" y="130" width="130" height="70" rx="8" fill="rgba(20,184,166,0.08)" stroke="rgba(20,184,166,0.15)" />
  <rect x="70" y="220" width="170" height="90" rx="8" fill="rgba(20,184,166,0.08)" stroke="rgba(20,184,166,0.15)" />
  <rect x="260" y="220" width="210" height="90" rx="8" fill="rgba(20,184,166,0.08)" stroke="rgba(20,184,166,0.15)" />

  <!-- Map Pins with Radar Pulse -->
  <!-- Pin 1 -->
  <circle cx="210" cy="180" r="16" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.4" />
  <circle cx="210" cy="180" r="7" fill="#14b8a6" filter="url(#resGlow)" />
  <!-- Pin 2: Active Alert -->
  <circle cx="370" cy="250" r="22" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.6" />
  <circle cx="370" cy="250" r="8" fill="#f43f5e" filter="url(#resGlow)" />

  <!-- Pin 3: In Progress -->
  <circle cx="130" cy="270" r="7" fill="#fbbf24" filter="url(#resGlow)" />

  <!-- Map Floating Detail Tag -->
  <rect x="230" y="275" width="200" height="58" rx="8" fill="rgba(10,25,35,0.92)" stroke="rgba(244,63,94,0.4)" />
  <circle cx="246" cy="295" r="4" fill="#f43f5e" />
  <text x="258" y="299" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">Pothole Hazard #402</text>
  <text x="246" y="320" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Assigned to Municipal Ward 8</text>

  <!-- Right Issue Cards List -->
  <rect x="520" y="96" width="240" height="98" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="542" cy="120" r="5" fill="#4ade80" />
  <text x="556" y="124" fill="#4ade80" font-family="Inter, sans-serif" font-weight="600" font-size="11">RESOLVED</text>
  <text x="536" y="148" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13">Drainage Overflow</text>
  <text x="536" y="170" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Fixed in 3.4 hrs • Bhopal</text>

  <rect x="520" y="208" width="240" height="98" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="542" cy="232" r="5" fill="#fbbf24" />
  <text x="556" y="236" fill="#fbbf24" font-family="Inter, sans-serif" font-weight="600" font-size="11">DISPATCHED</text>
  <text x="536" y="260" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13">Streetlight Line Fault</text>
  <text x="536" y="282" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Team on route • Sector 4</text>

  <rect x="520" y="320" width="240" height="100" rx="12" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.3)" />
  <text x="536" y="348" fill="#2dd4bf" font-family="Inter, sans-serif" font-weight="700" font-size="11">TOTAL CIVIC IMPACT</text>
  <text x="536" y="380" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24">12,480+</text>
  <text x="536" y="402" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Citizen Reports Solved</text>
</svg>
