<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="solBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f06" />
      <stop offset="50%" stop-color="#241a08" />
      <stop offset="100%" stop-color="#090703" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="sunRadial" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.45)" />
      <stop offset="50%" stop-color="rgba(245, 158, 11, 0.1)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#solBg)" />
  <rect width="800" height="450" fill="url(#sunRadial)" />

  <!-- Header -->
  <rect x="40" y="30" width="720" height="46" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="68" cy="53" r="5" fill="#ff5f56" />
  <circle cx="86" cy="53" r="5" fill="#ffbd2e" />
  <circle cx="104" cy="53" r="5" fill="#27c93f" />
  <text x="130" y="58" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">Helios 3D // Interactive Photovoltaic Solar Clean Energy Experience</text>
  <rect x="635" y="42" width="105" height="22" rx="11" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1" />
  <text x="687" y="57" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11" font-weight="700">3D WEBGL</text>

  <!-- Left: 3D Solar Panel Array Illustration -->
  <g transform="translate(60, 110)">
    <!-- Sun Ray Horizon -->
    <circle cx="580" cy="20" r="45" fill="url(#sunGlow)" filter="url(#goldGlow)" />
    <circle cx="580" cy="20" r="75" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />

    <!-- Isometric Solar Panel 1 -->
    <polygon points="60,180 220,130 360,190 200,250" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="2" />
    <!-- Panel Grid cells -->
    <line x1="140" y1="155" x2="280" y2="220" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" />
    <line x1="110" y1="205" x2="250" y2="145" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" />
    <line x1="160" y1="225" x2="300" y2="165" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" />

    <!-- Isometric Solar Panel 2 -->
    <polygon points="230,125 390,75 530,135 370,195" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="2" opacity="0.9" />
    <line x1="310" y1="100" x2="450" y2="165" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" />
    <line x1="280" y1="150" x2="420" y2="90" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" />
    <line x1="330" y1="170" x2="470" y2="110" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" />

    <!-- Panel 3 rear -->
    <polygon points="400,70 560,20 700,80 540,140" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="1.5" opacity="0.75" />

    <!-- Energy Particle Light Beams -->
    <line x1="560" y1="35" x2="220" y2="180" stroke="rgba(251,191,36,0.35)" stroke-width="2" stroke-dasharray="6,6" />
    <line x1="575" y1="40" x2="370" y2="135" stroke="rgba(251,191,36,0.5)" stroke-width="2" stroke-dasharray="6,6" />
  </g>

  <!-- Bottom Floating HUD metrics -->
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="210" height="70" rx="12" fill="rgba(20,15,5,0.85)" stroke="rgba(245,158,11,0.3)" />
    <text x="20" y="26" fill="#fbbf24" font-family="Inter, sans-serif" font-weight="600" font-size="11">ENERGY GENERATION</text>
    <text x="20" y="54" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">14.6 MWh <tspan fill="#4ade80" font-size="12">/mo</tspan></text>

    <rect x="235" y="0" width="210" height="70" rx="12" fill="rgba(20,15,5,0.85)" stroke="rgba(245,158,11,0.3)" />
    <text x="255" y="26" fill="#fbbf24" font-family="Inter, sans-serif" font-weight="600" font-size="11">CO₂ EMISSIONS CUT</text>
    <text x="255" y="54" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">-8.4 Tons</text>

    <rect x="470" y="0" width="210" height="70" rx="12" fill="rgba(20,15,5,0.85)" stroke="rgba(245,158,11,0.3)" />
    <text x="490" y="26" fill="#fbbf24" font-family="Inter, sans-serif" font-weight="600" font-size="11">CELL EFFICIENCY</text>
    <text x="490" y="54" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">23.8% <tspan fill="#f59e0b" font-size="12">Peak</tspan></text>
  </g>
</svg>
