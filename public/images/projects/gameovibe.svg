<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b061c" />
      <stop offset="50%" stop-color="#180b33" />
      <stop offset="100%" stop-color="#06020f" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="gameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#gameBg)" />

  <!-- Grid Perspective Floor -->
  <g stroke="rgba(168,85,247,0.18)" stroke-width="1.5">
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="390" x2="800" y2="390" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <line x1="400" y1="280" x2="50" y2="450" />
    <line x1="400" y1="280" x2="220" y2="450" />
    <line x1="400" y1="280" x2="380" y2="450" />
    <line x1="400" y1="280" x2="420" y2="450" />
    <line x1="400" y1="280" x2="580" y2="450" />
    <line x1="400" y1="280" x2="750" y2="450" />
  </g>

  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="46" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="68" cy="53" r="5" fill="#ff5f56" />
  <circle cx="86" cy="53" r="5" fill="#ffbd2e" />
  <circle cx="104" cy="53" r="5" fill="#27c93f" />
  <text x="130" y="58" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">Gameovibe Studio // AI Game Engine &amp; Reactive WebGL Experience</text>
  <rect x="635" y="42" width="105" height="22" rx="11" fill="rgba(236,72,153,0.2)" stroke="#ec4899" stroke-width="1" />
  <text x="687" y="57" text-anchor="middle" fill="#f472b6" font-family="Inter, sans-serif" font-size="11" font-weight="700">120 FPS</text>

  <!-- Center Stage Holographic Gamepad & Neon Logo -->
  <g transform="translate(400, 160)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(168,85,247,0.3)" stroke-width="2" stroke-dasharray="8,8" />
    <circle cx="0" cy="0" r="64" fill="rgba(15,10,35,0.8)" stroke="url(#neonPink)" stroke-width="2" filter="url(#gameGlow)" />
    
    <!-- Gamepad Path -->
    <path d="M -30 -12 Q 0 -24 30 -12 Q 42 16 24 30 Q 14 26 0 20 Q -14 26 -24 30 Q -42 16 -30 -12 Z" fill="none" stroke="#38e1ff" stroke-width="3" filter="url(#gameGlow)" />
    
    <!-- D-pad & Buttons -->
    <rect x="-18" y="-5" width="8" height="8" rx="2" fill="#ec4899" />
    <circle cx="14" cy="-5" r="3.5" fill="#f43f5e" />
    <circle cx="21" cy="2" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Title on Center Stage -->
  <text x="400" y="275" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="34" letter-spacing="4">GAMEOVIBE AI</text>
  <text x="400" y="298" text-anchor="middle" fill="#38e1ff" font-family="Inter, sans-serif" font-weight="600" font-size="13" letter-spacing="2">NEXT-GEN INTERACTIVE VIBE CODING &amp; SHADER GAMEPLAY</text>

  <!-- Left Stats Card -->
  <rect x="50" y="100" width="180" height="150" rx="14" fill="rgba(15,10,35,0.85)" stroke="rgba(236,72,153,0.3)" />
  <text x="70" y="128" fill="#f472b6" font-family="Inter, sans-serif" font-weight="600" font-size="11">AUDIO VIBE SYNC</text>
  <g transform="translate(70, 145)">
    <rect x="0" y="20" width="10" height="40" rx="3" fill="#ec4899" />
    <rect x="16" y="5" width="10" height="55" rx="3" fill="#a855f7" />
    <rect x="32" y="30" width="10" height="30" rx="3" fill="#38bdf8" />
    <rect x="48" y="10" width="10" height="50" rx="3" fill="#ec4899" />
    <rect x="64" y="0" width="10" height="60" rx="3" fill="#a855f7" />
    <rect x="80" y="25" width="10" height="35" rx="3" fill="#38bdf8" />
    <rect x="96" y="15" width="10" height="45" rx="3" fill="#ec4899" />
    <rect x="112" y="35" width="10" height="25" rx="3" fill="#38bdf8" />
  </g>
  <text x="70" y="235" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">BPM: 142 • Reactive</text>

  <!-- Right HUD Card -->
  <rect x="570" y="100" width="180" height="150" rx="14" fill="rgba(15,10,35,0.85)" stroke="rgba(56,225,255,0.3)" />
  <text x="590" y="128" fill="#38e1ff" font-family="Inter, sans-serif" font-weight="600" font-size="11">AI NPC LOGIC</text>
  <text x="590" y="155" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18">Neural Bots</text>
  <text x="590" y="175" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">LLM Behavior State</text>
  <rect x="590" y="195" width="140" height="30" rx="6" fill="rgba(56,225,255,0.15)" stroke="#38e1ff" stroke-width="1" />
  <text x="660" y="215" text-anchor="middle" fill="#38e1ff" font-family="Inter, sans-serif" font-weight="700" font-size="11">ADAPTIVE COMBAT</text>

  <!-- Bottom Floating Badges -->
  <g transform="translate(200, 375)">
    <rect x="0" y="0" width="120" height="34" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)" />
    <text x="60" y="22" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">WebGL 2.0</text>
  </g>
  <g transform="translate(340, 375)">
    <rect x="0" y="0" width="120" height="34" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)" />
    <text x="60" y="22" text-anchor="middle" fill="#ec4899" font-family="Inter, sans-serif" font-size="12" font-weight="600">Three.js</text>
  </g>
  <g transform="translate(480, 375)">
    <rect x="0" y="0" width="120" height="34" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)" />
    <text x="60" y="22" text-anchor="middle" fill="#38e1ff" font-family="Inter, sans-serif" font-size="12" font-weight="600">AI Shaders</text>
  </g>
</svg>
