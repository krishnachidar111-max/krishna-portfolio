<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b1633" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38e1ff" />
      <stop offset="100%" stop-color="#4d8dff" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff6b4a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Grid Pattern -->
  <g stroke="rgba(77,141,255,0.07)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Header bar -->
  <rect x="40" y="30" width="720" height="46" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="68" cy="53" r="5" fill="#ff5f56" />
  <circle cx="86" cy="53" r="5" fill="#ffbd2e" />
  <circle cx="104" cy="53" r="5" fill="#27c93f" />
  <text x="130" y="58" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">EchoGuard AI // Real-time Biometric Audio Security Shield</text>
  <rect x="630" y="42" width="112" height="22" rx="11" fill="rgba(56,225,255,0.15)" stroke="#38e1ff" stroke-width="1" />
  <circle cx="642" cy="53" r="3.5" fill="#38e1ff" />
  <text x="652" y="57" fill="#38e1ff" font-family="Inter, sans-serif" font-size="11" font-weight="600">LIVE DEFENSE</text>

  <!-- Main Left Card: Voice Waveform Spectrum -->
  <rect x="40" y="96" width="450" height="230" rx="16" fill="url(#cardGrad)" stroke="rgba(77,141,255,0.25)" />
  <text x="64" y="130" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" letter-spacing="1">AUDIO STREAM SPECTRAL ANALYSIS</text>
  <text x="64" y="154" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">Synthesized Voice Detection Engine</text>

  <!-- Waveform Graphic -->
  <g transform="translate(64, 175)">
    <!-- Baseline -->
    <line x1="0" y1="60" x2="400" y2="60" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4,4" />
    <!-- Audio Wave glow -->
    <path d="M 0 60 Q 25 15, 50 60 T 100 60 T 150 20 T 200 95 T 250 5 T 300 110 T 350 45 T 400 60" fill="none" stroke="url(#cyanGlow)" stroke-width="4" filter="url(#glow)" />
    <!-- Comparison / Clone Wave -->
    <path d="M 0 60 Q 20 80, 50 60 T 100 75 T 150 60 T 200 40 T 250 90 T 300 20 T 350 80 T 400 60" fill="none" stroke="rgba(255, 95, 86, 0.55)" stroke-width="2" stroke-dasharray="3,3" />
  </g>

  <!-- Live Stats row in left card -->
  <rect x="64" y="270" width="120" height="36" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" />
  <text x="76" y="293" fill="#38e1ff" font-family="Inter, sans-serif" font-weight="700" font-size="13">Latency: 18ms</text>

  <rect x="194" y="270" width="130" height="36" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" />
  <text x="206" y="293" fill="#a5b4fc" font-family="Inter, sans-serif" font-weight="700" font-size="13">Model: ResNet-9B</text>

  <rect x="334" y="270" width="130" height="36" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" />
  <text x="346" y="293" fill="#4ade80" font-family="Inter, sans-serif" font-weight="700" font-size="13">Accuracy: 99.4%</text>

  <!-- Right Card: Risk Score Dial -->
  <rect x="510" y="96" width="250" height="230" rx="16" fill="url(#cardGrad)" stroke="rgba(77,141,255,0.25)" />
  <text x="534" y="130" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" letter-spacing="1">SECURITY VERDICT</text>

  <!-- Circular Dial -->
  <circle cx="635" cy="195" r="54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10" />
  <circle cx="635" cy="195" r="54" fill="none" stroke="url(#alertGrad)" stroke-width="10" stroke-dasharray="339" stroke-dashoffset="85" stroke-linecap="round" filter="url(#glow)" />
  <text x="635" y="196" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24">98.7%</text>
  <text x="635" y="214" text-anchor="middle" fill="#ff6b6b" font-family="Inter, sans-serif" font-weight="600" font-size="11">DEEPFAKE DETECTED</text>

  <rect x="534" y="270" width="202" height="36" rx="8" fill="rgba(255, 51, 102, 0.15)" stroke="rgba(255, 51, 102, 0.4)" />
  <text x="635" y="293" text-anchor="middle" fill="#ff708f" font-family="Inter, sans-serif" font-weight="700" font-size="12">⚠️ CALL INTERCEPTED</text>

  <!-- Bottom Panel: Transaction & Activity stream -->
  <rect x="40" y="344" width="720" height="76" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="70" cy="382" r="14" fill="rgba(77,141,255,0.2)" stroke="#4d8dff" />
  <path d="M 66 382 L 69 385 L 75 379" stroke="#38e1ff" stroke-width="2" fill="none" />
  <text x="96" y="377" fill="#ffffff" font-family="Inter, sans-serif" font-weight="600" font-size="13">Banking Session Protected - SBI Account #9204</text>
  <text x="96" y="394" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Spoofed voice vector neutralised before unauthorized fund transfer initiation</text>
  <text x="730" y="386" text-anchor="end" fill="#38e1ff" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12">14:02:18 UTC</text>
</svg>
