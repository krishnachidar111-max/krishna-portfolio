<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ssBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1f" />
      <stop offset="50%" stop-color="#111836" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(99,102,241,0.4)" />
      <stop offset="100%" stop-color="rgba(56,189,248,0.0)" />
    </linearGradient>
    <filter id="ssGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#ssBg)" />

  <!-- Grid lines -->
  <g stroke="rgba(99,102,241,0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="170" x2="800" y2="170" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="46" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="68" cy="53" r="5" fill="#ff5f56" />
  <circle cx="86" cy="53" r="5" fill="#ffbd2e" />
  <circle cx="104" cy="53" r="5" fill="#27c93f" />
  <text x="130" y="58" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">SmartStock AI // Demand Forecast &amp; Autonomous Supply Chain Engine</text>
  <rect x="635" y="42" width="105" height="22" rx="11" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1" />
  <text x="687" y="57" text-anchor="middle" fill="#4ade80" font-family="Inter, sans-serif" font-size="11" font-weight="700">OPTIMIZED</text>

  <!-- Metric Badges -->
  <rect x="40" y="94" width="220" height="74" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <text x="58" y="120" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="500">PREDICTED DEMAND SPIKE</text>
  <text x="58" y="150" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">+48.2% <tspan fill="#38bdf8" font-size="13">Q3</tspan></text>

  <rect x="290" y="94" width="220" height="74" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <text x="308" y="120" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="500">STOCKOUT RISK SAVINGS</text>
  <text x="308" y="150" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">₹4.85 L <tspan fill="#4ade80" font-size="13">Saved</tspan></text>

  <rect x="540" y="94" width="220" height="74" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <text x="558" y="120" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="500">ACCURACY CONFIDENCE</text>
  <text x="558" y="150" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">97.8% <tspan fill="#a855f7" font-size="13">Ensemble</tspan></text>

  <!-- Big Graph Container -->
  <rect x="40" y="184" width="720" height="236" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(99,102,241,0.25)" />

  <!-- Graph Axes & Guides -->
  <line x1="80" y1="360" x2="720" y2="360" stroke="rgba(255,255,255,0.1)" />
  <line x1="80" y1="310" x2="720" y2="310" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4" />
  <line x1="80" y1="260" x2="720" y2="260" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4" />
  <line x1="80" y1="210" x2="720" y2="210" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4" />

  <!-- Area under curve -->
  <path d="M 80 340 Q 140 330, 200 310 T 320 280 T 440 230 T 560 210 T 640 190 T 720 170 L 720 360 L 80 360 Z" fill="url(#areaFill)" />
  <!-- Curve line -->
  <path d="M 80 340 Q 140 330, 200 310 T 320 280 T 440 230 T 560 210 T 640 190 T 720 170" fill="none" stroke="url(#indigoGlow)" stroke-width="3.5" filter="url(#ssGlow)" />

  <!-- Prediction dashed line -->
  <path d="M 560 210 Q 640 160, 720 140" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- Glowing Point -->
  <circle cx="560" cy="210" r="6" fill="#38bdf8" filter="url(#ssGlow)" />
  <circle cx="560" cy="210" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

  <!-- Floating Tooltip Box -->
  <rect x="520" y="145" width="130" height="42" rx="6" fill="rgba(15,23,42,0.95)" stroke="#38bdf8" stroke-width="1" />
  <text x="532" y="162" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Auto-Reorder Point</text>
  <text x="532" y="178" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">1,450 Units (+32%)</text>

  <!-- X axis labels -->
  <text x="80" y="385" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Jan</text>
  <text x="200" y="385" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Mar</text>
  <text x="320" y="385" fill="#64748b" font-family="Inter, sans-serif" font-size="11">May</text>
  <text x="440" y="385" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Jul</text>
  <text x="560" y="385" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="700">Today</text>
  <text x="670" y="385" fill="#a855f7" font-family="Inter, sans-serif" font-size="11">AI Forecast</text>
</svg>
